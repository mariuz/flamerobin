# Configuration for the Firebird client library bundled with FlameRobin.
#
# FlameRobin ships its own libfbclient in /opt/flamerobin/lib, together with
# the plugins in /opt/flamerobin/plugins/firebird.  That set includes the
# Engine13 plugin, so a database registered without a server host name is
# opened in embedded mode - no Firebird server needed.
#
# Everything below is commented out: without it the Firebird defaults apply.

# Which providers are tried, in order, and for which the plugins must be
# present in /opt/flamerobin/plugins/firebird.
#
# Engine13 opens ODS 13.0 and 13.1 databases, which are the ones created by
# Firebird 4 and Firebird 5.  To also open an ODS 12 database (Firebird 3)
# without backup and restore, copy libEngine12.so out of a Firebird 3
# installation into /opt/flamerobin/plugins/firebird and list it here.
#
#Providers = Remote, Engine13, Loopback

# The lock table and the other shared files live in the directory named by the
# FIREBIRD_LOCK environment variable, /tmp/firebird by default.  That directory
# has to be writable by whoever runs FlameRobin: if a Firebird server package
# created it for its own user, embedded connections fail with "Permission
# denied".  Note that a database opened in embedded mode must never be opened
# by a Firebird server at the same time unless both use the same lock
# directory.
