# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'vcpkg'
      - 'vcpkg/**'
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]
    paths-ignore:
      - 'vcpkg'
      - 'vcpkg/**'
  schedule:
    - cron: '36 12 * * 4'

jobs:
  analyze:
    name: Analyze
    #runs-on: ubuntu-latest
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]
        # Learn more:
        # https://docs.github.com/en/free-pro-team@latest/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#changing-the-languages-that-are-analyzed

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git cmake libnotify-dev libwxgtk3.2-dev libwxgtk-webview3.2-dev libicu-dev xvfb xdotool doxygen libboost-all-dev autoconf autoconf-archive automake libtool libx11-dev libxft-dev libxext-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libibus-1.0-dev libdbus-1-dev libglib2.0-dev libatk1.0-dev gettext libxi-dev libxtst-dev libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libxrender-dev libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev libxdamage-dev libxfixes-dev libepoxy-dev libcups2-dev libfontconfig1-dev ninja-build libwebkit2gtk-4.1-dev libsecret-1-dev
        sudo ldconfig

    - name: Cache vcpkg binaries
      uses: actions/cache@v6
      with:
        path: vcpkg_archives
        key: ${{ runner.os }}-vcpkg-bin-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
            ${{ runner.os }}-vcpkg-bin-

    - name: Bootstrap vcpkg
      run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

    - name: Install dependencies (vcpkg)
      env:
        VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_archives
      run: |
        mkdir -p vcpkg_archives
        success=0
        for i in {1..3}; do
          ./vcpkg/vcpkg install && { success=1; break; }
          echo "vcpkg install failed, retrying in 10 seconds..."
          sleep 10
        done
        if [ $success -ne 1 ]; then
          echo "vcpkg install failed after 3 attempts"
          exit 1
        fi

    - name: Download Firebird 5 client
      run: |
        wget -nv -O Firebird-5.0.4.1812-0-linux-x64.tar.gz \
            "https://github.com/FirebirdSQL/firebird/releases/download/v5.0.4/Firebird-5.0.4.1812-0-linux-x64.tar.gz"
        tar xzf Firebird-5.0.4.1812-0-linux-x64.tar.gz
        tar xzf Firebird-5.0.4.1812-0-linux-x64/buildroot.tar.gz -C Firebird-5.0.4.1812-0-linux-x64
        mkdir -p fb-client
        cp -P Firebird-5.0.4.1812-0-linux-x64/opt/firebird/lib/libfbclient.so* fb-client/
        cp -r Firebird-5.0.4.1812-0-linux-x64/opt/firebird/include fb-client/
        cp -r Firebird-5.0.4.1812-0-linux-x64/opt/firebird/plugins fb-client/
        sudo mkdir -p /opt/firebird/lib /opt/firebird/include /opt/firebird/plugins
        sudo cp -P fb-client/libfbclient.so* /opt/firebird/lib/
        sudo cp -r fb-client/include/. /opt/firebird/include/
        sudo cp -r fb-client/plugins/. /opt/firebird/plugins/
        echo "/opt/firebird/lib" | sudo tee /etc/ld.so.conf.d/firebird.conf
        sudo ldconfig

    - name: Configure CMake
      env:
        VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_archives
      run: |
        cmake -G Ninja -S . -B Build -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake -DENABLE_VCPKG=ON -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/vcpkg_installed" -DFB_CPP_BUILD_TESTS=OFF

    # Initialize CodeQL after vcpkg bootstrap/install and CMake configuration so CodeQL
    # only traces FlameRobin's own build instead of third-party vcpkg/buildtrees sources.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql-config.yml

    - name: Build
      run: cmake --build Build -j $(nproc)

    - name: Perform CodeQL Analysis
      id: analyze
      uses: github/codeql-action/analyze@v3
      with:
        upload: "failure-only"
        output: sarif-results

    - name: Filter out vcpkg paths from SARIF
      env:
        SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
      run: |
        python3 - <<'PY'
        import glob, json, os, urllib.parse

        sarif_dir = os.environ["SARIF_DIR"]
        workspace = os.path.realpath(os.environ["GITHUB_WORKSPACE"]).replace("\\", "/").rstrip("/") + "/"
        ignored_prefixes = (
            "vcpkg/",
            "vcpkg_installed/",
            "Build/vcpkg_installed/",
            "build/vcpkg_installed/",
        )

        def is_ignored(uri: str) -> bool:
            if not uri:
                return False
            if uri.startswith("file://"):
                uri = urllib.parse.unquote(urllib.parse.urlparse(uri).path)
            norm = uri.replace("\\", "/")
            if norm.startswith(workspace):
                norm = norm[len(workspace):]
            norm = norm.lstrip("./")
            return norm == "vcpkg" or norm.startswith(ignored_prefixes)

        for path in glob.glob(os.path.join(sarif_dir, "*.sarif")):
            with open(path, "r", encoding="utf-8") as f:
                sarif = json.load(f)
            removed = 0
            for run in sarif.get("runs", []):
                kept = []
                for res in run.get("results", []):
                    locs = res.get("locations", [])
                    if any(
                        is_ignored(
                            loc.get("physicalLocation", {})
                               .get("artifactLocation", {})
                               .get("uri", "")
                        )
                        for loc in locs
                    ):
                        removed += 1
                    else:
                        kept.append(res)
                run["results"] = kept
            with open(path, "w", encoding="utf-8") as f:
                json.dump(sarif, f)
            print(f"{path}: filtered out {removed} vcpkg result(s)")
        PY

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.analyze.outputs.sarif-output }}
