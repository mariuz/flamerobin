name: Build FlameRobin for Debian

env:
  wx-tag-version: v3.2.6
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    # Installing required dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake libicu-dev dpkg-dev libfbclient2 firebird3.0-server firebird3.0-utils firebird-dev firebird3.0-server-core firebird3.0-common rsync doxygen libboost-all-dev autoconf autoconf-archive automake libtool libx11-dev libxft-dev libxext-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libibus-1.0-dev libdbus-1-dev libglib2.0-dev libatk1.0-dev gettext libxi-dev libxtst-dev libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libxrender-dev libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev libxdamage-dev libxfixes-dev libepoxy-dev libcups2-dev libfontconfig1-dev libwebkit2gtk-4.1-dev libsecret-1-dev
        sudo ldconfig

    - name: Cache vcpkg binaries
      uses: actions/cache@v4
      with:
        path: vcpkg_archives
        key: ${{ runner.os }}-vcpkg-bin-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
            ${{ runner.os }}-vcpkg-bin-

    - name: Bootstrap vcpkg
      run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

    - name: Install dependencies (vcpkg)
      env:
        VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_archives
      run: |
        mkdir -p vcpkg_archives
        for i in {1..3}; do
          ./vcpkg/vcpkg install && break
          if [ $i -eq 3 ]; then
            echo "vcpkg install failed after 3 attempts"
            exit 1
          fi
          echo "vcpkg install failed, retrying in 10 seconds..."
          sleep 10
        done

    # Building the CMake project for Flamerobin
    - name: Generate CMake project
      env:
        VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_archives
      run: |
        mkdir -p vcpkg_archives
        export PATH="/usr/local/bin:/opt/firebird/bin:${PATH:-}"
        export LD_LIBRARY_PATH="/usr/local/lib:/usr/lib/x86_64-linux-gnu:/opt/firebird/lib:${LD_LIBRARY_PATH:-}"
        cmake -S . -B Build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/flamerobin/ -DBUILD_TESTING=OFF -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake -DENABLE_VCPKG=ON

    # FlameRobin Compilation
    - name: Build Flamerobin
      run: |
        export PATH="/usr/local/bin:/opt/firebird/bin:${PATH:-}"
        export LD_LIBRARY_PATH="/usr/local/lib:/usr/lib/x86_64-linux-gnu:/opt/firebird/lib:${LD_LIBRARY_PATH:-}"
        cmake --build Build --config Release -j$(nproc)

    # Check where the generated binary is (flamerobin)
    - name: Locate the compiled executable file for flamerobin
      run: |
        find Build/ -name "flamerobin" -type f
        du -skh Build/flamerobin

     # Add the lib depends of the flamerobin build app to -> templates/trees/deb/flamerobin/opt/flamerobin/lib/
    - name: Add the lib depends of the flamerobin app to "templates/trees/deb/flamerobin/opt/flamerobin/lib/"
      run: |
        mkdir -p templates/trees/deb/flamerobin/opt/flamerobin/lib 2> /dev/null
        ldd Build/flamerobin | awk '{print $3}' | grep "vcpkg_installed" | grep -v "not found" | xargs -I {} cp -v {} templates/trees/deb/flamerobin/opt/flamerobin/lib/
        
    # The bundled Firebird client resolves its plugins, its international
    # module and its message file relative to its own location (binreloc), so
    # /opt/flamerobin/lib/libfbclient.so.2 looks for them under
    # /opt/flamerobin.  Without the engine plugin there is no embedded mode and
    # Firebird silently falls back to a network connection to "localhost" -
    # GitHub issue #721.
    - name: Add the bundled Firebird plugins, intl and message file to "templates/trees/deb/flamerobin/opt/flamerobin/"
      run: |
        set -e
        DEB_TREE=templates/trees/deb/flamerobin/opt/flamerobin
        # Take the Firebird tree from the client the executable actually links,
        # wherever vcpkg installed it.
        FB_ROOT=$(ldd Build/flamerobin | awk '{print $3}' | grep -m1 "vcpkg_installed.*libfbclient" | sed 's#/lib/libfbclient.*##')
        echo "Firebird tree: ${FB_ROOT}"
        test -d "${FB_ROOT}/plugins/firebird"
        test -d "${FB_ROOT}/intl"

        mkdir -p "${DEB_TREE}/plugins/firebird"
        cp -v "${FB_ROOT}"/plugins/firebird/* "${DEB_TREE}/plugins/firebird/"
        mkdir -p "${DEB_TREE}/intl"
        cp -v "${FB_ROOT}"/intl/* "${DEB_TREE}/intl/"
        mkdir -p "${DEB_TREE}/share/firebird"
        cp -rv "${FB_ROOT}"/share/firebird/firebird.msg "${FB_ROOT}"/share/firebird/tzdata "${DEB_TREE}/share/firebird/"

        # The engine plugin needs the libraries it was built against, which the
        # ldd of flamerobin alone does not pull in.
        ldd "${FB_ROOT}"/plugins/firebird/* "${FB_ROOT}"/intl/* 2>/dev/null \
          | awk '{print $3}' | grep "vcpkg_installed" | grep -v "not found" | sort -u \
          | xargs -I {} cp -v -n {} "${DEB_TREE}/lib/"

        # The engine is ~200 MB with its debug info, and 12 MB without.
        find "${DEB_TREE}/plugins/firebird" "${DEB_TREE}/intl" -name "*.so" \
          -exec strip --strip-unneeded {} +

        # The engine must actually be there, or the .deb is no better than before.
        test -f "${DEB_TREE}/plugins/firebird/libEngine13.so"
        du -sh "${DEB_TREE}/plugins/firebird" "${DEB_TREE}/intl"

    # Set the version of the flamerobin program and move its executable to -> templates/trees/deb/flamerobin/opt/flamerobin/bin/ 
    - name: Set the version of the Flamerobin program and move its executable to "templates/trees/deb/flamerobin/opt/flamerobin/bin/"
      run: |
        FLAMEROBIN_VERSION=$(awk '
          /FR_VERSION_MAJOR/ { major = $3 } 
          /FR_VERSION_MINOR/ { minor = $3 }
          /FR_VERSION_RLS/   { rls   = $3 }
          END { print major "." minor "." rls }
          ' src/frversion.h)
        #
        echo "flamerobin version : $FLAMEROBIN_VERSION"

        # Adding the `FLAMEROBIN_VERSION` variable in the GitHub environment
        echo "FLAMEROBIN_VERSION=$FLAMEROBIN_VERSION" >> $GITHUB_ENV

        sed -i "s/^Version: .*/Version: ${FLAMEROBIN_VERSION}/" templates/trees/deb/flamerobin/DEBIAN/control
        mkdir -p templates/trees/deb/flamerobin/opt/flamerobin/bin 2> /dev/null
        cp -r Build/flamerobin templates/trees/deb/flamerobin/opt/flamerobin/bin/
    
    # Copy some necessary files except "flamerobin" to -> /opt/flamerobin/share/flamerobin
    - name: Copy necessary files to package directory "/opt/flamerobin/share/flamerobin/"
      run: |
        mkdir -p templates/trees/deb/flamerobin/opt/flamerobin/share/flamerobin 2> /dev/null
        rsync -av --exclude=flamerobin Build/ templates/trees/deb/flamerobin/opt/flamerobin/share/flamerobin/

    # Generate the .deb file
    - name: Build .deb package
      run: |
        dpkg-deb --build templates/trees/deb/flamerobin templates/trees/deb/flamerobin-${FLAMEROBIN_VERSION}.deb

    # Uploading the installer as a GitHub Actions artifact
    - name: Upload .deb package
      uses: actions/upload-artifact@v4
      with:
        name: flamerobin-deb
        path: templates/trees/deb/flamerobin-${{ env.FLAMEROBIN_VERSION }}.deb
