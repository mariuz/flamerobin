name: flamerobin
base: core24
adopt-info: flamerobin
summary: Database administration tool for Firebird RDBMS
description: |
  FlameRobin is a lightweight, cross-platform database administration tool for
  the Firebird relational database management system.
  Our goals are to be:
  - lightweight (small footprint, fast execution)
  - cross-platform (Windows, Linux, macOS, FreeBSD, Solaris)
  - dependent only on other open-source software

grade: stable
confinement: strict

apps:
  flamerobin:
    command: usr/bin/flamerobin
    desktop: usr/share/applications/flamerobin.desktop
    extensions: [gnome]
    common-id: org.flamerobin.FlameRobin
    plugs:
      - home
      - network

parts:
  flamerobin:
    plugin: cmake
    source: .
    source-depth: 0
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_VCPKG=ON
      - -DFB_CPP_BUILD_TESTS=OFF
    override-pull: |
      craftctl default
      # Bootstrap vcpkg
      ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
    override-build: |
      export VCPKG_ROOT="$SNAPCRAFT_PART_SRC/vcpkg"
      craftctl default
      
      # Extract version for adopt-info
      MAJOR=$(grep FR_VERSION_MAJOR $SNAPCRAFT_PART_SRC/src/frversion.h | awk '{print $3}')
      MINOR=$(grep FR_VERSION_MINOR $SNAPCRAFT_PART_SRC/src/frversion.h | awk '{print $3}')
      RLS=$(grep FR_VERSION_RLS $SNAPCRAFT_PART_SRC/src/frversion.h | awk '{print $3}')
      craftctl set version="$MAJOR.$MINOR.$RLS"
    build-packages:
      - libgtk-3-dev
      - libnotify-dev
      - libjpeg-dev
      - libtiff-dev
      - libpng-dev
      - libsecret-1-dev
      - libwebkit2gtk-4.1-dev
      - libpango1.0-dev
      - libglib2.0-dev
      - libicu-dev
      - libboost-all-dev
      - gettext
      - ninja-build
      - curl
      - zip
      - unzip
      - tar
      - pkg-config
    stage-packages:
      - libtommath1
      - libsecret-1-0
    cmake-generator: Ninja
